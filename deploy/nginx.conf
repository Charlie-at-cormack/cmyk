# Paste into Plesk: Websites & Domains > <domain> > Apache & nginx Settings > Additional nginx directives.
# Replace __PORT__ with the port in /etc/systemd/system/cmyk.service.
# A regex location ("~ /") is used because Plesk already defines "location /".
location ~ / {
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Print PDFs run to ~150 MB; analysis and large page renders can take a while.
    client_max_body_size 250m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
